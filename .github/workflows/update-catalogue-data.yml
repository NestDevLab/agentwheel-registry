name: Update catalogue data

on:
  schedule:
    - cron: "17 6 * * 0,2-6"
    - cron: "17 6 * * 1"
  workflow_dispatch:
  repository_dispatch:
    types: [catalogue-sync]
  push:
    branches: [main]
    paths:
      - "index.json"
      - "catalogue/**"

permissions:
  contents: write
  issues: write

concurrency:
  group: update-catalogue-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: main
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
      - name: Build catalogue data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CRAWL_CAP: 200
          OPENPACK_CRAWL_CAP: 50
          MCP_REGISTRY_CRAWL_CAP: 200
          CLAWHUB_CRAWL_CAP: 50
          FETCH_TIMEOUT_MS: 8000
          MCP_REGISTRY_FETCH_TIMEOUT_MS: 30000
          VERCEL_INDEX_REFRESH: ${{ github.event.schedule == '17 6 * * 1' && '1' || '0' }}
        run: node catalogue/build.mjs
      - name: Commit changes
        run: |
          if git diff --quiet -- catalogue-data.json catalogue-vercel-index.json catalogue/refresh-state.json; then
            echo "Catalogue data unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add catalogue-data.json catalogue-vercel-index.json catalogue/refresh-state.json
          git commit -m "chore: update catalogue data"
          git push
      - name: Report provider failures
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          state_file=catalogue/refresh-state.json
          failures=$(jq -r '[.providers | to_entries[] | select(.value.status == "failed") | "\(.key): \(.value.error)"] | join("\n")' "$state_file")
          issue=$(gh issue list --state open --search '"Catalogue sync failing" in:title' --json number --jq '.[0].number // empty')
          if [ -n "$failures" ]; then
            body=$(printf 'Catalogue refresh completed with stale provider data:\n\n%s\n\nRun: %s/actions/runs/%s' "$failures" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")
            if [ -n "$issue" ]; then
              gh issue comment "$issue" --body "$body"
            else
              gh issue create --title 'Catalogue sync failing' --body "$body"
            fi
            exit 1
          fi
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body "Recovered in $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            gh issue close "$issue"
          fi
